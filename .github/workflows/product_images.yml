name: Фото товаров МС

on:
  workflow_dispatch:
    inputs:
      group: {description: "Часть пути группы товаров", type: string}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      GROUP: ${{ inputs.group }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u product_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images
          path: images
          retention-days: 3
      - name: Фото в ветку images-<группа>
        run: |
          cd images
          git init -q -b main
          git config user.name kaspi-stock-bot
          git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "Фото ${GROUP}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" main:images-${GROUP}
