name: Создать отгрузки из заказов (разово)

on:
  workflow_dispatch:
    inputs:
      exts: {type: string}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      EXTS: ${{ inputs.exts }}
      DRY_RUN: "0"
    steps:
      - uses: actions/checkout@v4
      - run: python3 force_demand.py
