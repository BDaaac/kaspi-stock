name: Kaspi — возвраты (диагностика)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      KASPI_TOKEN: ${{ secrets.KASPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u kaspi_ret_diag.py
