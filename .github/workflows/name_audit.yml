name: МС — изменения наименований товаров

on:
  workflow_dispatch:
    inputs:
      days: {description: "За сколько дней", type: string, default: "21"}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u name_audit.py
