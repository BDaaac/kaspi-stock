name: Kaspi — оплата / возврат по заказу (вручную)
on:
  workflow_dispatch:
    inputs:
      code: {description: "Номер заказа Kaspi", type: string, required: true}
      action: {description: "pay — оплата, return — возврат", type: choice, options: [pay, return]}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      KASPI_TOKEN: ${{ secrets.KASPI_TOKEN }}
      CODE: ${{ inputs.code }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u kaspi_manual.py
