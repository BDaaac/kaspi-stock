name: Ozon — возвраты в пути и повторные покупатели

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u ozon_returns_transit.py

