name: Заказы → МойСклад (ручной запуск)

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Записывать в МойСклад (иначе только отчёт)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dryrun:
    runs-on: ubuntu-latest
    env:
      MS_TOKEN: ${{ secrets.MS_TOKEN }}
      MS_ORDERS_TOKEN: ${{ secrets.MS_ORDERS_TOKEN }}
      KASPI_TOKEN: ${{ secrets.KASPI_TOKEN }}
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      DRY_RUN: ${{ inputs.write && '0' || '1' }}
      INCLUDE_FBO: "1"
      RESERVE: "1"
      AUTO_ASSEMBLE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Заказы
        run: python3 orders_sync.py
      - name: Отчёт в ветку reports
        if: ${{ !cancelled() }}
        run: |
          cp orders_report.md /tmp/orders_report.md
          git switch --orphan reports
          cp /tmp/orders_report.md orders_report.md
          git add orders_report.md
          git -c user.name="kaspi-stock-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Отчёт проверки заказов"
          git push -f origin reports
